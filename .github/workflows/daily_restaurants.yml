name: Daily Restaurant Aggregator

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      initial_scan:
        description: "Run initial bulk scan (fetches all restaurants)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      resume_scan:
        description: "Resume bulk scan — skips cities already in the store"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run restaurant aggregator
        run: |
          if [ "${{ github.event.inputs.initial_scan }}" = "true" ]; then
            python restaurants_main.py --initial-scan
          elif [ "${{ github.event.inputs.resume_scan }}" = "true" ]; then
            python restaurants_main.py --resume
          else
            python restaurants_main.py
          fi

      - name: Commit results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Restaurant Aggregator Bot"
          git add docs/restaurants.json docs/restaurants.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: restaurant scan $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
