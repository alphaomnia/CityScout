# Prague & Brno Restaurant Aggregator — Runtime Configuration

cities:
  - prague
  - brno

adapters:
  - openstreetmap
  - mapy_cz
  - foursquare
  - google_places

store:
  path: docs/restaurants.json

dashboard:
  template: docs/_restaurants_template.html
  output: docs/restaurants.html

deduplication:
  similarity_threshold: 0.85

log_new_count: true
